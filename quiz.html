<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Quiz | Fortnite BG</title><link rel="stylesheet" href="assets/style.css"></head><body><header><div class="nav"><a class="brand" href="index.html">FORTNITE <span>BG</span></a><nav aria-label="Navigation">
<a class="navbtn " href="index.html">Accueil</a><a class="navbtn " href="skins.html">Skins</a><a class="navbtn " href="actualites.html">Actualités</a><a class="navbtn active" href="quiz.html">Quiz</a><a class="navbtn " href="carte.html">Carte</a>
</nav></div></header><main><section><div class="section-head"><div><div class="eyebrow">À toi de jouer</div><h1>Quiz Fortnite</h1><p class="muted">5 questions pour tester tes connaissances.</p></div></div><div class="quizbox"><div class="tag" id="progress">Question 1 / 5</div><h3 id="question">Chargement…</h3><div class="answers" id="answers"></div><p class="muted" id="feedback" aria-live="polite"></p><button class="primary" id="next" hidden>Question suivante</button><button class="primary" id="restart" hidden>Recommencer</button></div></section></main><footer>FORTNITE BG • Fan site non officiel • Fortnite et ses éléments appartiennent à Epic Games.</footer><script>
const qs=[{q:'Quelle entreprise développe Fortnite ?',a:['Epic Games','Nintendo','Mojang'],c:0},{q:'Quel est le but principal du mode Battle Royale ?',a:['Construire une ville','Être le dernier joueur ou équipe en jeu','Finir une course'],c:1},{q:'Quel objet permet de se déplacer rapidement dans certains modes ?',a:['Un véhicule','Une potion de soin','Un coffre'],c:0},{q:'Comment appelle-t-on la zone qui rétrécit pendant une partie ?',a:['La tempête','Le portail','Le brouillard'],c:0},{q:'Quel mode permet de créer ses propres expériences ?',a:['Créatif','Sauver le monde uniquement','Spectateur'],c:0}];
let i=0,score=0,locked=false;const q=document.getElementById('question'),a=document.getElementById('answers'),f=document.getElementById('feedback'),p=document.getElementById('progress'),n=document.getElementById('next'),r=document.getElementById('restart');
function load(){locked=false;f.textContent='';n.hidden=true;r.hidden=true;p.textContent=`Question ${i+1} / ${qs.length}`;q.textContent=qs[i].q;a.innerHTML='';qs[i].a.forEach((v,j)=>{let b=document.createElement('button');b.className='answer';b.textContent=v;b.onclick=()=>pick(j,b);a.appendChild(b)})}
function pick(j,b){if(locked)return;locked=true;const c=qs[i].c;[...a.children].forEach((x,k)=>{x.disabled=true;if(k===c)x.classList.add('correct')});if(j===c){score++;f.textContent='Bonne réponse ! 🎉'}else{b.classList.add('wrong');f.textContent='Pas tout à fait ! La bonne réponse est : '+qs[i].a[c]}if(i===qs.length-1){r.hidden=false;r.textContent=`Résultat : ${score}/${qs.length} — Rejouer`}else n.hidden=false}
n.onclick=()=>{i++;load()};r.onclick=()=>{i=0;score=0;load()};load();</script></body></html>
